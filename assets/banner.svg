<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <radialGradient id="glow1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow2" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>

    <style>
      @keyframes floatLeft {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1.5deg); }
      }
      @keyframes floatRight {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(10px) rotate(-1.5deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.08); }
      }
      @keyframes flowLight {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      .animated-card-left {
        animation: floatLeft 6s ease-in-out infinite;
      }
      .animated-card-right {
        animation: floatRight 7s ease-in-out infinite;
      }
      .pulsing-glow {
        animation: pulseGlow 5s ease-in-out infinite;
        transform-origin: center;
      }
      .flowing-line {
        stroke-dasharray: 20, 10;
        animation: flowLight 15s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Animated Ambient Glows -->
  <circle cx="250" cy="140" r="300" fill="url(#glow1)" class="pulsing-glow" />
  <circle cx="950" cy="280" r="320" fill="url(#glow2)" class="pulsing-glow" />

  <!-- Cyber Grid -->
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Dynamic Background Geometric Flow Lines -->
  <path class="flowing-line" d="M -50 210 Q 300 80, 600 210 T 1250 210" fill="none" stroke="#4f46e5" stroke-width="1.5" stroke-opacity="0.4" />
  <path class="flowing-line" d="M -50 260 Q 350 360, 650 240 T 1250 270" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Dynamic Background Badges / Floating Elements (Stay away from center text) -->
  <g class="animated-card-left" opacity="0.85">
    <rect x="70" y="55" width="210" height="44" rx="22" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="94" cy="77" r="10" fill="#10b981" />
    <text x="114" y="82" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">⚡ Sourcing &amp; Pipelines</text>
  </g>

  <g class="animated-card-left" opacity="0.85" style="animation-delay: -2s;">
    <rect x="50" y="320" width="225" height="44" rx="22" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="74" cy="342" r="10" fill="#6366f1" />
    <text x="94" y="347" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🤖 AI Candidate Matching</text>
  </g>

  <g class="animated-card-right" opacity="0.85">
    <rect x="915" y="55" width="225" height="44" rx="22" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="939" cy="77" r="10" fill="#38bdf8" />
    <text x="959" y="82" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🎯 Structured Scorecards</text>
  </g>

  <g class="animated-card-right" opacity="0.85" style="animation-delay: -3s;">
    <rect x="920" y="320" width="215" height="44" rx="22" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="944" cy="342" r="10" fill="#ec4899" />
    <text x="964" y="347" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🌐 100% Self-Hosted ATS</text>
  </g>

  <!-- FOREGROUND: Core Content Layer (Always sharp, clear, and unobstructed) -->
  <!-- Top Category Tag -->
  <g transform="translate(600, 105)">
    <rect x="-160" y="-18" width="320" height="36" rx="18" fill="#1e293b" stroke="url(#accentGrad)" stroke-width="1.5" />
    <text x="0" y="5" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" text-anchor="middle">CURATED TALENT INFRASTRUCTURE</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="185" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" text-anchor="middle" letter-spacing="-0.5">
    Awesome Applicant Tracking Systems
  </text>

  <!-- Subtitle -->
  <text x="600" y="232" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" text-anchor="middle">
    Leading SaaS Platforms &amp; Star-Ranked Open-Source ATS Engines
  </text>

  <!-- Tagline / Value Proposition -->
  <text x="600" y="268" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" text-anchor="middle">
    Pipeline Management • AI Resume Parsing • Interview Scheduling • Recruitment CRM • Self-Hosting
  </text>
</svg>
